name: build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore server
        run: dotnet restore src/StoneAge.Server/StoneAge.Server.csproj

      - name: Build server
        run: dotnet build src/StoneAge.Server/StoneAge.Server.csproj -c Release --no-restore

      - name: Restore test client
        run: dotnet restore tools/StoneAge.TestClient/StoneAge.TestClient.csproj

      - name: Build test client
        run: dotnet build tools/StoneAge.TestClient/StoneAge.TestClient.csproj -c Release --no-restore

      - name: Restore tests
        run: dotnet restore tests/StoneAge.Game.Tests/StoneAge.Game.Tests.csproj

      - name: Test game
        run: dotnet test tests/StoneAge.Game.Tests/StoneAge.Game.Tests.csproj -c Release --no-restore
