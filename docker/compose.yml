services:
  postgres:
    image: postgres:18.6-alpine
    container_name: stoneage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stoneage
      POSTGRES_USER: stoneage
      POSTGRES_PASSWORD: stoneage_dev
    ports:
      - "5432:5432"
    volumes:
      - stoneage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoneage -d stoneage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stoneage_pgdata:
